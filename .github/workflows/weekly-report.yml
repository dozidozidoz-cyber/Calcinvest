# ============================================================
# CalcInvest — Rapport de marché hebdomadaire auto-généré
# ============================================================
# Lundi 06h00 UTC : régénère /marche-cette-semaine avec les perfs
# de la semaine, le régime de tendance et l'activité Smart Money.
# Contenu frais hebdomadaire = signal SEO + page partageable.
# ============================================================
name: Weekly market report

on:
  schedule:
    - cron: '0 6 * * 1'   # lundi 06h00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # historique complet : update_sitemap_lastmod.js lit git log
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install yfinance pandas

      - name: Generate report
        run: python scripts/generate_weekly_report.py

      # Resynchronise les <lastmod> sur la vraie date de modification de
      # chaque page. Sans ca le sitemap se fige : toutes les dates étaient
      # restées au 2026-07-02 alors que des pages changeaient, privant
      # Google de son signal de recrawl.
      - name: Resynchroniser les dates du sitemap
        run: node scripts/update_sitemap_lastmod.js

      - name: Commit & push
        run: |
          git config user.name "calcinvest-bot"
          git config user.email "actions@github.com"
          git add marche-cette-semaine.html sitemap.xml
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "content: rapport marché hebdo + sitemap ($(date -u +%Y-%m-%d))"
            git push
          fi
